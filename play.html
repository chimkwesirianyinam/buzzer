<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Contestant | PIC Competition Software</title>
  <link rel="icon" href="/pic-logo.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="play">
  <header class="ptop">
    <img class="c" src="/pic-logo.png" alt="Penny International College crest">
    <div><div class="t">PIC Competition Software</div><div class="s">Penny International College</div></div>
    <div class="comp-slot filled hidden" id="compSlot"></div>
  </header>

  <!-- Join screen -->
  <main class="play-wrap" id="joinView">
    <div class="joinhero"><h1>Take your seat.</h1><p>Enter the room code, pick your school and add your name.</p></div>
    <form class="card" id="joinForm" novalidate>
      <label class="label" for="code">1. Room code</label>
      <input type="text" id="code" class="input codeinput" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD">
      <div class="msg" id="codeMsg" role="status"></div>

      <div id="schoolStep" class="hidden">
        <label class="label">2. Choose your school</label>
        <div class="tiles" id="tiles"></div>

        <label class="label" for="name">3. Your name</label>
        <input type="text" id="name" class="input" maxlength="24" autocomplete="nickname" placeholder="Enter your name">
      </div>

      <div class="msg err" id="err" role="alert" style="margin:10px 0"></div>
      <button class="btn primary lg block" type="submit" id="joinBtn">Join</button>
    </form>
  </main>

  <!-- Buzzer screen -->
  <main class="play-wrap hidden" id="playView">
    <section class="card team-banner">
      <div id="tbLogo"></div>
      <div style="min-width:0">
        <div class="tb-school" id="tbSchool"></div>
        <div class="tb-student" id="tbStudent"></div>
      </div>
      <div class="tb-score"><div class="score" id="tbScore">0</div><small>School score</small></div>
    </section>
    <section class="pstage">
      <button id="buzzer" type="button" disabled>Locked</button>
      <div class="status" id="status" aria-live="polite"></div>
    </section>
    <div class="pills">
      <span class="chip" id="conn">Connecting</span>
      <span class="chip">Room <span id="room"></span></span>
    </div>
  </main>

  <div class="foot">PIC Competition Software &middot; Penny International College</div>

  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    document.body.insertAdjacentHTML('afterbegin', '<div class="bgfx stage">' + stageLayers({ orbs: [[6, 30, 120, 3], [90, 22, 150, 4]], sparks: [[20, 18], [70, 14, .8], [12, 60], [88, 52, .8]] }) + '</div>');
    const params = new URLSearchParams(location.search);
    const savedKey = (c) => 'pic_player_' + c;
    const getSaved = (c) => { try { return JSON.parse(safeGet(savedKey(c))); } catch { return null; } };

    let sock = null, joined = false, state = null, room = null, chosen = null;

    // ---------- competition icon ----------
    function showComp(code, v) {
      const slot = $('compSlot');
      slot.replaceChildren();
      if (v) { slot.append(el('img', { src: `/logo/${code}/_comp?v=${v}`, alt: 'Competition icon' })); slot.classList.remove('hidden'); }
      else slot.classList.add('hidden');
    }

    // ---------- join screen ----------
    async function loadRoom(code) {
      $('codeMsg').textContent = ''; $('codeMsg').className = 'msg';
      try {
        const r = await fetch('/api/room/' + encodeURIComponent(code), { cache: 'no-store' });
        if (r.status === 404) {
          room = null; $('schoolStep').classList.add('hidden');
          $('codeMsg').textContent = 'Room not found. Check the code.'; $('codeMsg').className = 'msg err';
          return;
        }
        room = await r.json();
      } catch {
        $('codeMsg').textContent = 'Could not reach the server. Check your connection.'; $('codeMsg').className = 'msg err';
        return;
      }
      showComp(room.code, room.compV);
      if (!room.schools.length) {
        $('schoolStep').classList.add('hidden');
        $('codeMsg').textContent = 'The host has not added any schools yet. Try again shortly.'; $('codeMsg').className = 'msg';
        return;
      }
      $('schoolStep').classList.remove('hidden');
      if (chosen && !room.schools.some((s) => s.id === chosen)) chosen = null;
      renderTiles();
    }

    function renderTiles() {
      const box = $('tiles'); box.replaceChildren();
      for (const s of room.schools) {
        const full = s.count >= room.teamSize;
        const b = el('button', { type: 'button', class: 'tile', 'aria-pressed': String(chosen === s.id), disabled: full },
          logoNode(room.code, s.id, s.name, s.logoV, 'md'),
          el('span', { class: 'tn' }, s.name),
          el('span', { class: 'tc' }, full ? 'Team full' : s.count + ' of ' + room.teamSize + ' joined'));
        b.addEventListener('click', () => { chosen = s.id; renderTiles(); $('err').textContent = ''; });
        box.append(b);
      }
    }

    $('code').addEventListener('input', (e) => {
      const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
      e.target.value = v;
      if (v.length === 4) loadRoom(v);
      else { room = null; $('schoolStep').classList.add('hidden'); $('codeMsg').textContent = ''; }
    });

    $('joinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      $('err').textContent = '';
      const code = $('code').value.trim().toUpperCase();
      if (code.length !== 4) return ($('err').textContent = 'Enter the 4-letter room code.');
      if (!room) return ($('err').textContent = 'Enter a valid room code first.');
      if (!chosen) return ($('err').textContent = 'Choose your school.');
      const name = $('name').value.trim();
      if (!name) return ($('err').textContent = 'Enter your name.');
      connectAndJoin(code, chosen, name);
    });

    function showJoin() { $('playView').classList.add('hidden'); $('joinView').classList.remove('hidden'); }

    // ---------- connection ----------
    function connectAndJoin(code, schoolId, name) {
      if (sock) sock.close();
      joined = false;
      sock = createSocket({
        onStatus(ok) {
          $('conn').textContent = ok ? 'Online' : 'Reconnecting';
          
        },
        onOpen() {
          const sv = getSaved(code);
          sock.send({ t: 'join', code, schoolId, name, playerId: sv && sv.id });
        },
        onMessage(m) {
          if (m.t === 'join_fail') {
            safeDel(savedKey(code));
            if (!joined) {
              sock.close(); $('err').textContent = m.reason; showJoin();
              if (/^[A-Z]{4}$/.test(code)) loadRoom(code);
            } else location.reload();
          } else if (m.t === 'join_ok') {
            joined = true;
            safeSet(savedKey(m.code), JSON.stringify({ id: m.playerId, schoolId: m.schoolId, name }));
            safeSet('pic_last_code', m.code);
            $('room').textContent = m.code;
            $('joinView').classList.add('hidden');
            $('playView').classList.remove('hidden');
          } else if (m.t === 'state') { state = m; render(); }
          else if (m.t === 'kicked') {
            sock.close(); safeDel(savedKey(code));
            alert('You have been removed from this competition by the host.');
            location.href = '/play';
          }
        },
      });
    }

    // ---------- buzzer screen ----------
    function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

    function render() {
      const s = state, y = s.you, b = $('buzzer'), st = $('status');
      $('tbSchool').textContent = y.school;
      $('tbStudent').textContent = y.name;
      $('tbScore').textContent = y.score;
      $('tbLogo').replaceChildren(logoNode(s.code, y.schoolId, y.school, y.logoV, 'lg'));
      showComp(s.code, s.compV);
      st.replaceChildren();
      b.className = '';

      if (s.teamPos) {
        b.disabled = true;
        if (s.teamPos === 1) { b.className = 'first'; b.textContent = 'First'; }
        else { b.className = 'taken'; b.textContent = 'Buzzed'; }
        st.append(s.byYou ? 'You buzzed for ' + y.school : (s.byName || 'A teammate') + ' buzzed for your school',
          el('small', {}, s.teamPos === 1 ? 'Your school was first to buzz.' : 'Your school is ' + ordinal(s.teamPos) + ' in the buzz order.'));
      } else if (s.phase === 'open') {
        b.disabled = false; b.className = 'ready'; b.textContent = 'Buzz';
        st.append('Buzzers are open',
          s.winner ? el('small', {}, s.winner.school + ' has buzzed. You can still buzz.') : el('small', {}, 'Tap the button to answer for ' + y.school + '.'));
      } else {
        b.disabled = true; b.textContent = 'Locked';
        if (s.winner) st.append(s.winner.school + ' buzzed first', el('small', {}, s.winner.student));
        else st.append('Waiting for the host', el('small', {}, 'The buzzers will open for the next question.'));
      }
    }

    function buzz() {
      if (!state || state.phase !== 'open' || state.teamPos) return;
      sock.send({ t: 'buzz' });
      if (navigator.vibrate) navigator.vibrate(60);
      // Immediate feedback; the server's reply is the source of truth.
      const b = $('buzzer'); b.className = 'taken'; b.textContent = '...'; b.disabled = true;
    }
    $('buzzer').addEventListener('pointerdown', (e) => { e.preventDefault(); buzz(); });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && joined) { e.preventDefault(); buzz(); }
    });

    // ---------- start ----------
    (function init() {
      const urlCode = (params.get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
      const code = urlCode || (safeGet('pic_last_code') || '');
      $('code').value = code;
      const sv = code.length === 4 ? getSaved(code) : null;
      if (sv && sv.schoolId && sv.name) {
        // Rejoin automatically after a page refresh.
        connectAndJoin(code, sv.schoolId, sv.name);
      } else if (code.length === 4) {
        loadRoom(code);
      }
    })();
  </script>
</body>
</html>
